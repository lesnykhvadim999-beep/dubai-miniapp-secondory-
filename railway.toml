[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python3 resale_bot.py"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Reliability audit 2026-05-30: Railway pings /health (fsst_core.start_health_server)
# 503 → auto-restart. Без этого зомби-инстансы с упавшей БД продолжали "жить".
healthcheckPath = "/health"
healthcheckTimeout = 30
# PHASE BN/BO post-rotation: numReplicas=1 защищает Telethon SESSION_STRING
# (Telegram блокирует session при использовании из 2 разных IP/контейнеров).
numReplicas = 1
